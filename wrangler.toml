name = "app-for-learning-language"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# OpenNext Worker entry point
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "wordlink-db"
database_id = "" # Will be set after running: wrangler d1 create wordlink-db

# Production environment (optional - can be removed if not needed)
# [env.production]
# routes = []

