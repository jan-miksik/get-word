<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>wordlink – Language Helper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <button
        class="mode-btn settings-btn"
        id="settings-btn"
        type="button"
      >
        Settings
      </button>
      <button
        class="mode-btn show-all-btn"
        id="show-all-btn"
        type="button"
      >
        🙈
      </button>
      <button
        class="mode-btn switch-btn"
        id="switch-btn"
        type="button"
      >
        Hide…
      </button>

      <section class="settings-panel" id="settings-panel" aria-label="Settings">
        <div class="settings-inner">
          <p class="settings-title">Who are you?</p>
          <label class="settings-option">
            <input type="radio" name="learner-role" value="cz" />
            <span>I am Czech</span>
          </label>
          <label class="settings-option">
            <input type="radio" name="learner-role" value="vi" />
            <span>I am Vietnamese</span>
          </label>
        </div>
      </section>

      <main class="phrases" id="phrases" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="View selection">
        <button
          class="bottom-nav-btn is-active"
          data-tab="all"
          type="button"
        >
          All words
        </button>
        <button
          class="bottom-nav-btn"
          data-tab="ready"
          type="button"
        >
          Ready to repeat
        </button>
      </nav>

      <footer class="app-footer">
        <p class="hint">
          💡 <strong>Tip:</strong> In hidden modes, press and hold on a word to
          see it. Release to hide again.
        </p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
