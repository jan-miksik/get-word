<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>wordlink – Language Helper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <section class="mode-switcher" aria-label="Display mode">
        <button
          class="mode-btn is-active"
          data-mode="hide-cz"
          type="button"
        >
          Hide Czech
        </button>
        <button
          class="mode-btn"
          data-mode="hide-envi"
          type="button"
        >
          Hide EN + VI
        </button>
        <button
          class="mode-btn"
          data-mode="hide-vi"
          type="button"
        >
          Hide VI
        </button>
        <button
          class="mode-btn"
          data-mode="show-all"
          type="button"
        >
          Show all
        </button>
      </section>

      <main class="phrases" id="phrases" aria-live="polite"></main>

      <footer class="app-footer">
        <p class="hint">
          💡 <strong>Tip:</strong> In hidden modes, press and hold on a word to
          see it. Release to hide again.
        </p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
