  <title
     id="title1">Get Word app icon variants</title>
  <desc
     id="desc1">Six color variants of an organic blob icon inspired by a hand-drawn speech-bubble shape, presented on rounded square tiles.</desc>
  <defs
     id="defs4">
    <pattern
       xlink:href="#pattern11378-0"
       id="pattern58"
       patternTransform="matrix(2.5,0,0,2.5,165,570)"
       x="0"
       y="0"
       preserveAspectRatio="xMidYMid" />
    <!-- Reusable blob shape: an organic top-heavy droplet/ghost with an asymmetric tail.
       Drawn within a 200x200 box, intended to be placed via <use> with x/y. -->
    <symbol
       id="blob"
       viewBox="0 0 200 200"
       overflow="visible">
      <!-- Soft outer halo (spray feel) -->
      <path
         d="m 100,18 c 45,0 78,32 78,74 0,26 -10,46 -26,60 -12,10 -20,18 -24,30 -4,10 -12,14 -20,10 C 96,186 88,174 78,162 60,144 32,130 28,100 24,60 58,18 100,18 Z"
         opacity="0.35"
         id="path1" />
      <!-- Mid layer -->
      <path
         d="m 100,28 c 38,0 68,28 68,66 0,22 -8,38 -22,52 -10,10 -18,18 -22,28 -4,10 -12,12 -18,8 C 96,176 90,166 82,156 66,142 42,128 40,100 38,64 64,28 100,28 Z"
         opacity="0.7"
         id="path2" />
      <!-- Core shape -->
      <path
         d="m 100,38 c 32,0 58,24 58,58 0,18 -6,32 -18,44 -8,8 -14,16 -18,26 -4,8 -12,10 -17,6 C 96,166 92,158 86,150 72,138 52,124 52,100 52,68 74,38 100,38 Z"
         id="path3" />
      <!-- Highlight (paper showing through) -->
      <ellipse
         cx="78"
         cy="66"
         rx="9"
         ry="14"
         fill="#ffffff"
         opacity="0.85"
         id="ellipse3" />
      <ellipse
         cx="82"
         cy="62"
         rx="4"
         ry="6"
         fill="#ffffff"
         id="ellipse4" />
    </symbol>
    <!-- Tile background (rounded square, iOS-ish) -->
    <symbol
       id="tile"
       viewBox="0 0 200 200">
      <rect
         x="0"
         y="0"
         width="200"
         height="200"
         rx="44"
         ry="44"
         id="rect4" />
    </symbol>
    <pattern
       patternUnits="userSpaceOnUse"
       width="10"
       height="6"
       style="fill:#000000"
       patternTransform="translate(165,570)"
       id="pattern11378-0">
      <path
         style="stroke:none;stroke-width:4.8561;stroke-linecap:square;paint-order:stroke markers fill;stop-color:#000000"
         d="M 0,6 V 0 H 10 V 6 C 10,3 8,1 5,1 2,1 0,3 0,6 Z"
         id="path11356-3" />
    </pattern>
    <pattern
       xlink:href="#pattern11378-0"
       id="pattern1"
       patternTransform="matrix(2.5,0,0,2.5,165,570)"
       x="0"
       y="0"
       preserveAspectRatio="none" />
    <pattern
       xlink:href="#pattern11378-0"
       id="pattern3"
       patternTransform="matrix(2.5,0,0,2.5,165,570)"
       x="0"
       y="0"
       preserveAspectRatio="none" />
    <pattern
       patternUnits="userSpaceOnUse"
       width="10"
       height="6"
       style="fill:#000000"
       patternTransform="translate(165,570)"
       id="pattern11378-0-4">
      <path
         style="stroke:none;stroke-width:4.8561;stroke-linecap:square;paint-order:stroke markers fill;stop-color:#000000"
         d="M 0,6 V 0 H 10 V 6 C 10,3 8,1 5,1 2,1 0,3 0,6 Z"
         id="path11356-3-3" />
    </pattern>
    <pattern
       xlink:href="#pattern11378-0-4"
       id="pattern1-6"
       patternTransform="matrix(2.5,0,0,2.5,165,570)"
       x="0"
       y="0"
       preserveAspectRatio="none" />
    <pattern
       xlink:href="#pattern11378-0-4"
       id="pattern3-9"
       patternTransform="matrix(2.5,0,0,2.5,165,570)"
       x="0"
       y="0"
       preserveAspectRatio="none" />
  </defs>
  <!-- Row 1 -->
  <!-- 1. Original: blue blob on cream/white -->
  <!-- 2. Warm coral on cream -->
  <!-- 3. Mustard on deep navy -->
  <!-- Row 2 -->
  <!-- 4. Forest green on bone -->
  <!-- 5. Pink on lavender -->
  <!-- 6. Cream blob on terracotta -->
  <!-- Row 3 -->
  <!-- 7. Black on yellow (high contrast / brutalist) -->
  <g
     transform="translate(-29.306184,325.35861)"
     style="color:#ffffff;font-weight:400;font-size:16px;font-family:'Anthropic Sans', '-apple-system', system-ui, 'Segoe UI', sans-serif;dominant-baseline:auto;text-anchor:start;opacity:1;fill:#000000;stroke:none;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter"
     id="g18">
    <g
       id="use16-7-4"
       style="color:#ffffff;font-weight:400;font-size:16px;font-family:'Anthropic Sans', '-apple-system', system-ui, 'Segoe UI', sans-serif;dominant-baseline:auto;text-anchor:start;fill:url(#pattern58);fill-opacity:1;stroke:none;stroke-width:0;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:none;paint-order:stroke fill markers"
       transform="translate(29.306184,-325.35861)">
      <rect
         x="0"
         y="0"
         width="200"
         height="200"
         rx="0"
         ry="0"
         id="rect58" />
    </g>
    <g
       id="use17-7-6-9"
       style="color:#1a1a1a;font-weight:400;font-size:16px;font-family:'Anthropic Sans', '-apple-system', system-ui, 'Segoe UI', sans-serif;dominant-baseline:auto;text-anchor:start;mix-blend-mode:normal;fill:#e9c6af;fill-opacity:1;stroke:none;stroke-width:2;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:none;stroke-opacity:1"
       transform="translate(26.035714,-330.89713)">
      <!-- Soft outer halo (spray feel) -->
      <!-- Mid layer -->
      <!-- Core shape -->
      <path
         d="m 93.055842,39.786822 c 30.167388,-9.68662 64.021408,21.905596 64.021408,55.905599 0,17.999999 -6,31.999999 -18,43.999999 -8,8 -14,16 -18,26 -2.72055,14.48099 -12,10 -17,6 -8.999996,-6 -13.533623,-12.39912 -22.20176,-19.86549 -14,-12 -30.204508,-28.14186 -30.798236,-52.134509 C 50.291852,67.954222 68.300699,47.735592 93.055842,39.786822 Z"
         id="path33-2-1"
         style="fill:#e9c6af;fill-opacity:1" />
      <!-- Highlight (paper showing through) -->
    </g>
  </g>
  <!-- 8. Teal on warm white -->
  <!-- 9. Cream on charcoal (dark mode) -->
  <!-- Row 4 -->
  <!-- 10. Two-tone: blue blob + small mustard accent dot, like the original -->
  <!-- 11. Purple blob + green accent on cream -->
  <!-- 12. Coral blob + cream accent on dark teal -->
